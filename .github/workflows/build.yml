name: build-apk

on:
  workflow_dispatch:
    inputs:
      refresh_list:
        description: "Download the newest StevenBlack list before building"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Refresh blocklist (manual runs only)
        if: ${{ inputs.refresh_list }}
        run: python3 tools/update_blocklist.py

      - name: Self-test packet + blocklist logic
        run: |
          mkdir -p "$RUNNER_TEMP/jvmtest"
          javac -d "$RUNNER_TEMP/jvmtest" \
            app/src/main/java/app/dj/adshield/DnsPacket.java \
            app/src/main/java/app/dj/adshield/Blocklist.java \
            tools/DnsSelfTest.java
          java -cp "$RUNNER_TEMP/jvmtest" app.dj.adshield.DnsSelfTest app/src/main/assets/blocklist.txt

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            PASS="$KEYSTORE_PASS"
            echo "Using the stored signing key"
          else
            PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 \
              -alias adshield -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=AdShield personal build"
            echo "::notice::One-off signing key generated. Uninstall the previous AdShield before installing this build (or add KEYSTORE_B64 + KEYSTORE_PASS secrets for a stable key)."
          fi
          echo "ADSHIELD_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ADSHIELD_KS_PASS=$PASS" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Show APK hash and permissions
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          sha256sum "$APK"
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$AAPT2" dump permissions "$APK" || true

      - uses: actions/upload-artifact@v4
        with:
          name: AdShield-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
